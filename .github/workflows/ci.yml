name: Internet Search v2 checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Repository artifact check
        run: python3 scripts/check_repository.py
      - name: Test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r services/api/requirements.txt -r services/task-runner/requirements.txt -r tests/browser/requirements.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Build and migrate
        run: python3 scripts/bootstrap.py
      - name: Real local pipeline, recovery and UI
        run: .venv/bin/python scripts/test_v2.py --restart-test --browser
      - name: Archived regressions
        run: |
          PYTHONPATH=services/task-runner:shared .venv/bin/python -m unittest tests.unit.test_httpx_transition -v
          .venv/bin/python -m unittest tests.browser.test_task_panel -v
      - name: Offline scope benchmark
        run: python3 scripts/benchmark_v2.py
      - name: Diagnostics
        if: always()
        run: docker compose ps --all
      - name: Remove isolated CI resources
        if: always()
        run: docker compose --profile lab down --volumes --remove-orphans
